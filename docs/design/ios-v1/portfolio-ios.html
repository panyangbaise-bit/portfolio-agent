#pa-ios-preview .pa-stage { padding: 24px 8px 28px; min-height: 1140px; display: flex; justify-content: center; align-items: flex-start; }
#pa-ios-preview .pa-phone { color-scheme: light; --pa-bg: #ffffff; --pa-panel: #ffffff; --pa-text: #000000; --pa-sub: #666666; --pa-line: #cccccc; --pa-tint: #f1f3f4; --pa-brand: #000000; --pa-link: #0000ff; --pa-onbrand: #ffffff; --pa-gain: #00aa00; --pa-loss: #cc0000; width: 390px; max-width: 100%; min-height: 830px; background: var(--pa-bg); color: var(--pa-text); border: 1px solid #000000; border-radius: 40px; box-shadow: none; font: 14px/1.5 'IBM Plex Mono','PingFang SC','Microsoft YaHei',ui-monospace,monospace; letter-spacing: -.02em; overflow: clip; display: flex; flex-direction: column; }

#pa-ios-preview .pa-phone :where(button) { border: 0; background: none; padding: 0; text-align: left; min-height: 44px; }

#pa-ios-preview .pa-phone h1, #pa-ios-preview .pa-phone h2, #pa-ios-preview .pa-phone h3, #pa-ios-preview .pa-phone p { margin: 0; }

#pa-ios-preview .pa-phone h2 { font-size: 19px; font-weight: 700; line-height: 1.5; }
#pa-ios-preview .pa-phone h3 { font-size: 16px; font-weight: 700; }

<script>
(() => {
const root = document.getElementById('pa-ios-preview');
const catalog = [
 {id:'etf',name:'沪深300 ETF',code:'510300',type:'A股 ETF',short:'沪',price:4.2,currency:'CNY',fx:1,time:'10月21日 15:00',quote:'收盘价',account:'证券账户',qty:10000,cost:4},
 {id:'fund',name:'易方达蓝筹精选',code:'005827',type:'场外基金',short:'基',price:1.5,currency:'CNY',fx:1,time:'10月20日',quote:'官方净值',account:'支付宝',qty:20000,cost:1.42},
 {id:'hk',name:'腾讯控股',code:'00700',type:'港股',short:'腾',price:400,currency:'HKD',fx:.92,time:'10月21日 16:00',quote:'收盘价',account:'港股账户',qty:100,cost:370},
 {id:'us',name:'Apple',code:'AAPL',type:'美股',short:'A',price:200,currency:'USD',fx:7.2,time:'10月21日 04:00 北京时间',quote:'收盘价',account:'美股账户',qty:30,cost:193.3333333333},
 {id:'gold',name:'黄金 ETF',code:'518880',type:'黄金 ETF',short:'金',price:8,currency:'CNY',fx:1,time:'10月21日 15:00',quote:'收盘价',account:'证券账户',qty:1000,cost:7.48},
 {id:'new',name:'中证500 ETF',code:'510500',type:'A股 ETF',short:'中',price:6.25,currency:'CNY',fx:1,time:'10月21日 15:00',quote:'收盘价',account:'证券账户'}
];
const icon = n => `<i data-lucide="${n}" aria-hidden="true"></i>`;
const money = n => Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const colors = ['#000000','#0000ff','#666666','#8b5cf6','#ffaa00'];
const reports = {
 daily:{id:'daily-2026-10-21',label:'收盘总结',period:'10月21日',short:'10.21',title:'收盘之后，\n看清今天的变化。',summary:'A 股与美股对本轮估值变化贡献为正。基金采用最新公布净值。',gain:620,start:159380,cutoff:'10月21日 16:05',contributions:[['沪深300 ETF',260],['场外基金',160],['腾讯控股',-120],['Apple',240],['黄金 ETF',80]],question:'今天的变化主要来自哪里？'},
 weekly:{id:'weekly-2026-10-18',label:'每周复盘',period:'10月12日—18日',short:'10.12—10.18',title:'收益有起伏，\n配置更值得看。',summary:'本周收益主要来自 A 股与基金。港美股合计占比达到 50%。',gain:1760,start:158240,cutoff:'10月18日',contributions:[['沪深300 ETF',1200],['场外基金',640],['腾讯控股',-320],['Apple',160],['黄金 ETF',80]],question:'为什么港美股占比值得关注？'}
};
const saved = window.openai?.widgetState?.privateContent || {};
function makeApp(id,variant) {
 const phone=root.querySelector('#'+id);
 const state={page:'home',tab:'home',period:'1月',private:false,holdTab:'持有',selected:'etf',query:'',candidate:null,trade:'buy',notice:'',error:'',mutated:false,notify:true,dailyNotify:true,pushTime:'08:00',red:false,reportType:'daily',reviewed:{},reportFilter:'全部',used:{},messages:{},askMessages:[],premium:false,newsEnabled:false,upgradeFrom:'me',question:'',holdings:catalog.slice(0,5).map(x=>({...x})),history:[]};
 const design={compact:false,empty:false,stale:false,weeklyArrival:false};
 if(saved[id] && ['home','holdings','reviews','me'].includes(saved[id].tab)) { state.page=saved[id].tab;state.tab=saved[id].tab; }
 const holdings=()=>design.empty?[]:state.holdings.filter(x=>x.qty>0);
 const total=()=>holdings().reduce((s,x)=>s+x.qty*x.price*x.fx,0);
 const pnl=()=>holdings().reduce((s,x)=>s+x.qty*(x.price-x.cost)*x.fx,0);
 const currentReport=()=>reports[state.reportType];
 const remaining=()=>Math.max(0,3-(state.used[currentReport().id]||0));
 const quotaLabel=()=>state.premium?'订阅用户 · 追问不限次':`本报告还可追问 ${remaining()} / 3 次`;
 const navto=p=>{if(['ask','news'].includes(p)&&!state.premium){state.upgradeFrom=p;p='subscription';}state.page=p;if(['home','holdings','reviews','me'].includes(p))state.tab=p;state.error='';state.notice='';render();};
 function openReport(type){state.reportType=type;state.tab='reviews';navto('report');}
 const row=(label,value)=>`<div class="pa-row pa-softline"><span class="pa-sub">${label}</span><span class="pa-number">${value}</span></div>`;
 const back=p=>`<button type="button" class="pa-back" data-go="${p}">${icon('chevron-left')}返回</button>`;
 function heading(title,sub,action='') {return `<header class="pa-head"><div>${sub?`<div class="pa-eyebrow">${sub}</div>`:''}<h1>${title}</h1></div>${action}</header>`;}
 function addButton(){return `<button type="button" class="pa-circle" aria-label="添加持仓" data-go="search">${icon('plus')}</button>`;}
 function reportCard(type='daily'){const r=reports[type];return `<button type="button" class="pa-review-card" data-openreport="${type}"><div class="pa-row"><span class="pa-left">${icon(type==='daily'?'sunset':'file-text')}<span style="font-size:12px">AI ${r.label}</span></span><span class="pa-sub">${r.short}</span></div><h2>${esc(r.title).replace('\n','<br>')}</h2><p>${r.summary}</p><div class="pa-row" style="margin-top:16px"><span class="pa-sub">查看复盘</span>${icon('arrow-up-right')}</div></button>`;}
 function newsSummary(){return `<button type="button" class="pa-news-summary" data-go="news"><div class="pa-row"><span class="pa-sub">持仓动态 · 示例推送</span><span class="pa-sub">16:06</span></div><p>持仓公司的财报已更新，关注经营变化与原有投资判断。</p><div class="pa-row"><span class="pa-sub">公司公告 · 关联持仓</span>${icon('arrow-up-right')}</div></button>`;}
 function reviewWindow(){return `<section class="pa-review-window" aria-label="最新复盘窗口">${reportCard(design.weeklyArrival?'weekly':'daily')}${state.premium&&state.newsEnabled?newsSummary():''}</section>`;}
 function chart(){
  const paths={'1周':[41,38,30,34,20,24,12],'1月':[66,71,58,63,51,57,39,44,35,39,23,30,18,20,10],'3月':[84,77,80,67,71,54,61,46,50,33,41,28,31,10]};
  const a=paths[state.period],d=a.map((y,i)=>`${i?'L':'M'}${i*310/(a.length-1)},${y}`).join(' ');
  return `<div class="pa-row"><span class="pa-sub">持仓市值走势</span><span class="pa-sub">人民币</span></div><svg class="pa-chart" viewBox="0 0 310 104" role="img" aria-label="示例市值曲线，期末十六万元"><path d="M0 30H310 M0 65H310 M0 100H310" fill="none" stroke="var(--pa-line)" stroke-width="1"/><path d="${d} L310 100 L0 100Z" fill="var(--pa-tint)" opacity=".8"/><path d="${d}" fill="none" stroke="var(--pa-link)" stroke-width="2.4" stroke-linejoin="round"/><circle cx="310" cy="10" r="3.5" fill="var(--pa-link)"/></svg><div class="pa-axis"><span>${state.period==='1周'?'10.15':state.period==='1月'?'09.21':'07.21'}</span><span>10.21 · ¥160,000</span></div><div class="pa-segments">${['1周','1月','3月'].map(p=>`<button type="button" data-period="${p}" aria-pressed="${state.period===p}">${p}</button>`).join('')}</div><div class="pa-sub" style="text-align:center">市值变化包含持仓变化，不等同于收益</div>`;
 }
 function allocation(){const hs=holdings();return `<div class="pa-row pa-section"><h2>资产配置</h2><button type="button" class="pa-text-button" data-go="holdings">查看持仓 ${icon('chevron-right')}</button></div><div class="pa-bar">${hs.map((x,i)=>`<span style="width:${x.qty*x.price*x.fx/total()*100}%;background:${colors[i%5]}"></span>`).join('')}</div><div class="pa-legend">${hs.map((x,i)=>`<div class="pa-row"><span><b class="pa-dot" style="background:${colors[i%5]}"></b>${x.id==='etf'?'A 股':x.id==='fund'?'场外基金':x.id==='hk'?'港股':x.id==='us'?'美股':x.id==='gold'?'黄金':x.type}</span><span class="pa-number">${(x.qty*x.price*x.fx/total()*100).toFixed(1)}%</span></div>`).join('')}</div>`;}
 function home(){
  let h=heading('今天的投资回顾','DAILY BRIEF / 示例组合',addButton());
  if(!holdings().length)return h+`<div class="pa-empty"><div class="pa-logo">${icon('layers')}</div><h2>从第一笔持仓开始</h2><p>手动记录你的投资，<br>价格和净值自动更新。</p><button type="button" class="pa-primary" data-go="search">添加第一笔持仓</button></div>`;
  h+=reviewWindow();
  h+=`<section class="pa-metric" aria-label="组合市值"><div class="pa-row"><span class="pa-sub">持仓总市值 · CNY</span><button type="button" aria-label="${state.private?'显示':'隐藏'}总览金额" data-action="privacy" class="pa-text-button">${icon(state.private?'eye-off':'eye')}</button></div><div class="pa-amount pa-number">${state.private?'••••••':`<span class="pa-currency">¥</span>${money(total())}`}</div><div class="pa-row"><span class="pa-sub">持仓浮动盈亏</span><span class="${pnl()>=0?'pa-up':'pa-down'} pa-number">${state.private?'••••':`${pnl()>=0?'+':''}${money(pnl())} <span style="font-size:12px">(${pnl()>=0?'+':''}${(pnl()/(total()-pnl())*100).toFixed(2)}%)</span>`}</span></div><div class="pa-note">${design.stale?'行情暂未更新 · 部分价格已过期':'股票收盘价 / 基金最新净值'}</div></section>`;
  if(variant==='portfolio')h+=`<div class="pa-card" style="margin-top:7px">${state.private?'<div class="pa-note">总览金额已隐藏</div>':state.mutated?'<div class="pa-note">持仓已变化，新市值将从本次记录后开始跟踪。</div>':chart()}</div>`;
  h+=allocation();

 function subscription(){return back(['chat','ask','news'].includes(state.upgradeFrom)?(state.upgradeFrom==='chat'?'chat':'home'):'me')+heading('更多理解，持续跟踪','PORTFOLIO AGENT / PRO')+`<div class="pa-callout">订阅功能规划 · 未开放购买</div><div class="pa-card"><span class="pa-pill">免费版</span><h2 style="margin-top:12px">每天和每周，都能复盘</h2><p class="pa-prose">收盘总结、每周复盘免费阅读与推送。每一份报告各有 3 次免费追问。</p></div><div class="pa-card" style="border:2px solid #000000"><span class="pa-pro">PRO</span><h2 style="margin-top:12px">有问题，就继续问</h2><div class="pa-listrow"><span>报告追问</span><strong>不限次数</strong></div><div class="pa-listrow"><span>Ask Agent</span><span class="pa-sub">独立投资问答</span></div><div class="pa-listrow"><span>持仓新闻监测</span><span class="pa-sub">自动推送相关摘要</span></div></div><p class="pa-note">价格与购买流程后续确定。演示切换不产生订阅或扣费。</p>${state.premium?'<div class="pa-callout">当前正在预览订阅用户状态</div><button type="button" class="pa-secondary" data-action="free-demo">切回免费版演示</button>':'<button type="button" class="pa-primary" data-action="premium-demo">体验订阅版（演示）</button>'}`;}
 function ask(){return back('home')+heading('Ask Agent','PRO · 独立投资问答')+`<div class="pa-callout">订阅功能演示 · 未调用真实 AI</div><p class="pa-prose">从你的持仓出发，继续研究配置、历史交易与投资理由。</p>${state.askMessages.map(m=>`<div class="pa-chat-user pa-message">${esc(m.q)}</div><div class="pa-card pa-message"><p class="pa-prose">${esc(m.a)}</p></div>`).join('')}<form data-ask><label class="pa-field">你想了解什么？<input class="pa-input" name="question" placeholder="我的组合有哪些集中风险？" required maxlength="200"></label><button type="button" data-submit class="pa-primary">发送提问</button></form>`;}
 function news(){return back(state.tab==='reviews'?'reviews':'home')+heading('财报更新，回看持有理由','持仓动态 · 10月21日 16:06')+`<div class="pa-callout">虚构事件示例 · 未接入实时新闻</div><div class="pa-card"><span class="pa-sub">来源：公司公告（示例）</span><h2 style="margin-top:12px">发生了什么</h2><p class="pa-prose">一家持仓公司公布了新一期财报。摘要提取经营表现、现金流和管理层展望的变化。</p><h2 class="pa-section">与你的持仓有什么关系</h2><p class="pa-prose">可以对照最初的买入理由，查看这些变化是否影响长期判断。事件本身不等于买卖指令。</p></div><p class="pa-note">正式推送会附带关联标的、事件时间和可跳转的原始来源；此处不使用虚构外链。</p>`;}
 function accounts(){return back('me')+heading('持有账户','按实际资产归属管理')+`<div class="pa-card">${[...new Set(holdings().map(x=>x.account))].map(a=>`<div class="pa-listrow"><span>${esc(a)}</span><span class="pa-sub">${holdings().filter(x=>x.account===a).length} 项持仓</span></div>`).join('')}</div><div class="pa-callout">手工记录的账户，不代表已连接券商或基金平台。新增持仓时可填写账户名称。</div>`;}
 function history(){return back(state.tab==='holdings'?'detail':'me')+heading('手动记录','仅展示本次预览操作')+(state.history.length?state.history.map(x=>`<div class="pa-card"><div class="pa-row"><h3>${esc(x.name)}</h3><span class="pa-pill">${x.action}</span></div><p class="pa-prose">${x.qty} 份 · ${x.date}</p></div>`).join(''):'<div class="pa-empty"><h2>还没有新增记录</h2><p>添加持仓或记录买卖后，<br>会在这里留下记录。</p></div>');}
 const views={home,holdings:positions,detail,search,add:addForm,trade:tradeForm,reviews,report,sources,memory,chat,me,accounts,history,notifications,subscription,ask,news};
 function render(){
  phone.classList.toggle('pa-compact',design.compact);
  phone.style.setProperty('--pa-gain',state.red?'#cc0000':'#00aa00');phone.style.setProperty('--pa-loss',state.red?'#00aa00':'#cc0000');
  phone.innerHTML=`<div class="pa-status"><span>16:08</span><div class="pa-island" aria-hidden="true"></div><span class="pa-status-right">${icon('signal')}${icon('wifi')}${icon('battery-full')}</span></div><div class="pa-brandbar"><span class="pa-brandmark">P<span> / </span>A</span><button type="button" class="pa-agent-entry" data-go="ask" aria-label="Ask Agent">${icon('messages-square')}<span>Ask Agent</span></button></div><main class="pa-content">${state.notice?`<div class="pa-toast" role="status">${esc(state.notice)}</div>`:''}${(views[state.page]||home)()}</main><div class="pa-bottom"><nav class="pa-nav" aria-label="主导航">${[['home','总览','panels-top-left'],['holdings','持仓','layers'],['reviews','复盘','file-text'],['me','我的','user-round']].map(([p,l,i])=>`<button type="button" data-go="${p}" ${state.tab===p?'aria-current="page"':''}>${icon(i)}<span>${l}</span></button>`).join('')}</nav><div class="pa-homebar"></div></div>`;
  phone.querySelectorAll('button').forEach(b=>b.classList.add('cursor-interaction'));
  if(globalThis.lucide)lucide.createIcons();
 }
 function remember(){if(window.openai?.setWidgetState){const prior=window.openai.widgetState?.privateContent||{};window.openai.setWidgetState({modelContent:{prototype:'portfolio-ios-v1',visualStyle:'portfolio-agent-current',layout:variant,page:state.page},privateContent:{...prior,[id]:{tab:state.tab}}}).catch(()=>{});}}
 phone.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.hasAttribute('data-submit')){const f=b.closest('form');if(f.reportValidity())f.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));return;}
  if(b.dataset.openreport){openReport(b.dataset.openreport);remember();return;}
  if(b.dataset.upgrade){state.upgradeFrom=b.dataset.upgrade;navto('subscription');return;}
  if(b.dataset.filter){state.reportFilter=b.dataset.filter;render();return;}
  if(b.dataset.question){sendQuestion(b.dataset.question);return;}
  if(b.dataset.go){navto(b.dataset.go);remember();return;}
  if(b.dataset.detail){state.selected=b.dataset.detail;state.tab='holdings';navto('detail');}
  if(b.dataset.period){state.period=b.dataset.period;render();}
  if(b.dataset.holdtab){state.holdTab=b.dataset.holdtab;render();}
  if(b.dataset.candidate){state.candidate=b.dataset.candidate;state.tab='holdings';navto('add');}
  if(b.dataset.trade){state.trade=b.dataset.trade;navto('trade');}
  if(b.dataset.action==='privacy'){state.private=!state.private;render();}
  if(b.dataset.action==='notify'){state.notify=!state.notify;render();}
  if(b.dataset.action==='daily-notify'){state.dailyNotify=!state.dailyNotify;render();}
  if(b.dataset.action==='premium-demo'){state.premium=true;state.newsEnabled=true;navto(state.upgradeFrom);}
  if(b.dataset.action==='free-demo'){state.premium=false;state.newsEnabled=false;navto('me');}
  if(b.dataset.action==='colors'){state.red=!state.red;render();}
  if(b.dataset.action==='reviewed'){const id=currentReport().id;state.reviewed[id]=!state.reviewed[id];render();}
  remember();
 });
 phone.addEventListener('input',e=>{if(e.target.matches('[data-search]')){state.query=e.target.value;phone.querySelector('[data-results]').innerHTML=searchResults();}});
 phone.addEventListener('change',e=>{if(e.target.matches('[data-push-time]')){state.pushTime=e.target.value||'08:00';render();}});
 phone.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('form input')){e.preventDefault();const f=e.target.closest('form');if(f.reportValidity())f.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));}});
 phone.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=new FormData(f);
  if(f.matches('[data-add]')){
   const x=catalog.find(x=>x.id===state.candidate),qty=Number(d.get('qty')),cost=Number(d.get('cost')),account=String(d.get('account')).trim();
   if(design.stale||!account||![qty,cost].every(n=>Number.isFinite(n)&&n>0)){state.error='请填写有效数量、成本和账户，并检查行情状态。';render();return;}
   if(!design.empty&&state.holdings.some(h=>h.code===x.code&&h.account===account)){state.error='该账户已持有此标的，请到持仓详情记录买卖。';render();return;}
   if(design.empty){state.holdings=[];design.empty=false;}
   const item={...x,id:'added-'+Date.now(),qty,cost,account};state.holdings.push(item);state.history.unshift({name:x.name,action:'初始持仓',qty,date:d.get('date')});state.mutated=true;state.holdTab='持有';state.page='holdings';state.tab='holdings';state.notice='持仓已保存到本次演示';state.error='';render();
  }
  if(f.matches('[data-trade-form]')){
   const x=state.holdings.find(x=>x.id===state.selected),qty=Number(d.get('qty')),price=Number(d.get('price'));
   if(![qty,price].every(n=>Number.isFinite(n)&&n>0)||(state.trade==='sell'&&qty>x.qty)){state.error='请输入有效成交信息，卖出数量不能超过持仓。';render();return;}
   if(state.trade==='buy'){x.cost=(x.qty*x.cost+qty*price)/(x.qty+qty);x.qty+=qty;}else{x.qty-=qty;}
   state.history.unshift({name:x.name,action:state.trade==='buy'?'买入':'卖出',qty,date:d.get('date')});state.mutated=true;state.page='detail';state.notice='交易已记录到本次演示';state.error='';render();
  }
  if(f.matches('[data-chat]'))sendQuestion(String(d.get('question')));
  if(f.matches('[data-ask]'))sendQuestion(String(d.get('question')),true);
 });
 render();
 if(globalThis.Tweak){const t=new Tweak({container:phone,onChange:render});t.addToggle(design,'compact',{label:'紧凑持仓列表'});t.addToggle(design,'empty',{label:'展示空组合'});t.addToggle(design,'stale',{label:'行情中断状态'});t.addToggle(design,'weeklyArrival',{label:'预览周复盘送达'});}
}
makeApp('pa-review','review');
})();
</script>
