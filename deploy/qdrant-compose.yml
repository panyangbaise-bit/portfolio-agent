# Optional vector service for a small, single-user deployment.
# Start: docker compose -f deploy/qdrant-compose.yml up -d
services:
  qdrant:
    image: qdrant/qdrant:v1.18.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - portfolio-memory:/qdrant/storage
    # Initial guardrails, not a guarantee of capacity. Observe import + job peaks.
    mem_limit: 600m
    cpus: 0.75
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__SERVICE__MAX_WORKERS: "1"
      QDRANT__STORAGE__PERFORMANCE__MAX_OPTIMIZATION_THREADS: "1"
volumes:
  portfolio-memory:
